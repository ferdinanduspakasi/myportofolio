<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <input type="checkbox" id="dark-mode-toggle" class="visually-hidden">

    <div class="page">
        <header class="site-header">
            <div class="container">
                <a href="#profile" class="brand">{{ name }}</a>
                <nav>
                    <a href="{% url 'main:show_main' %}">Profile</a>
                    <a href="{% url 'main:show_experience' %}">Experience</a>
                    <label for="dark-mode-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                        <span class="theme-toggle-icon" aria-hidden="true"></span>
                    </label>
                </nav>
            </div>
        </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/photo.jpeg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    </p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/ferdinanduspakasi" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/ferdinanduspakasi/" class="social-link">LinkedIn</a>
                        <a href="mailto:ferdinandpakasi07@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
            </div>
        </footer>
    </div>
</body>
</html>
